  sensitivity: 0.1
  min_value: 0.0
  max_value: 35.0
  note: Use Gaussian Noise; sensitivity is set to 0.1 and not 0.01 since the general increase is in units
    of 0.1 kV and this can add more "meaningful" noise.
- target: feeder_sections.num_phase
