# Grid Kitchen noise catalog (schema: schemas/noise_catalog.linkml.yaml).
# Converted from "Noise Level Catalog.xlsx" (SharePoint) on 2026-11-10; this file is now the source.
# Every spreadsheet row gave epsilon 0.5 / delta 1e-5 ("moderate"), so epsilon and delta come from
# the mode (PNNL-37723 Table 1), not the rule.
modes:
- name: low
  epsilon: 1.0
  delta: 1.0e-05
- name: moderate
  epsilon: 0.5
  delta: 1.0e-05
- name: high
  epsilon: 0.1
  delta: 1.0e-12
rules:
- target: transformers.kva
  mechanism: discrete_laplace
  sensitivity: 1.0
  min_value: 5.0
  max_value: 100000.0
  note: Use Discrete Laplace Mechanism to calculate the noise; it will always return an integer
- target: transformers.count
  mechanism: discrete_laplace
  sensitivity: 1.0
  min_value: 1.0
  note: Use Discrete Laplace Mechanism to calculate the noise; it will always return an integer
- target: transformers.is_substation_transformer
  mechanism: randomized_response
  modes:
  - high
  note: We can use Randomized Response for a boolean variable, but giving incorrect information may reduce
    the utility of the dataset. We can keep the same value for moderate privacy; use Randomized Response
    for high privacy.
- target: transformers.num_phase
  mechanism: none
  note: We can use Randomized Response for this variable (considering it as a boolean jump from 1 to 3),
    but giving incorrect information may reduce the utility of the dataset. We can keep the same value
    for moderate privacy; use Randomized Response for high privacy (but not preferred).
- target: transformers.high_kv
  mechanism: gaussian
  sensitivity: 0.1
  min_value: 4.0
  max_value: 35.0
  note: Use Gaussian Noise; sensitivity is set to 0.1 and not 0.01 since the general increase is in units
    of 0.1 kV and this can add more "meaningful" noise.
- target: transformers.low_kv
  mechanism: gaussian
  sensitivity: 0.1
  min_value: 0.12
  max_value: 35.0
  note: Use Gaussian Noise; sensitivity is set to 0.1 and not 0.01 since the general increase is in units
    of 0.1 kV and this can add more "meaningful" noise; this actually mimics the settings for the high_kv,
    but we can optimize it more with real world data. If we see that most utilities have low_kv in terms
    of 0.01 or 0.1 kV, we can change it accordingly.
- target: transformers.avg_customers_served
  mechanism: gaussian
  sensitivity: 1.0
  sensitivity_kind: range_over_n
  min_value: 0.0
  note: Use Gaussian Noise; combining different noise calculation strategies will provide stronger privacy
    protection; max and min_customers_served_global are the highest and lowest values for the corresponding
    variables across the whole dataset. n is the number of transformers in this dataset
- target: transformers.min_customers_served
  mechanism: discrete_laplace
  sensitivity: 1.0
  min_value: 0.0
  note: Use Discrete Laplace Mechanism to calculate the noise; it will always return an integer
- target: transformers.max_customers_served
  mechanism: discrete_laplace
  sensitivity: 1.0
  min_value: 0.0
  note: Use Discrete Laplace Mechanism to calculate the noise; it will always return an integer
- target: transformers.std_customers_served
  mechanism: gaussian
  sensitivity: 1.0
  sensitivity_kind: range_over_sqrt_n
  min_value: 0.0
  note: Use Gaussian Noise
- target: transformers.min_pct_peak_loading
  mechanism: gaussian
  sensitivity: 0.1
  min_value: 0.0
  max_value: 150.0
  note: Use Gaussian Noise
- target: transformers.avg_pct_peak_loading
  mechanism: gaussian
  sensitivity: 1.0
  sensitivity_kind: range_over_n
  min_value: 0.0
  max_value: 150.0
  note: Use Gaussian Noise; max and min_pct_peak_loading_global are the highest and lowest values for
    the corresponding variables across the whole dataset. n is the number of transformers in this dataset
- target: transformers.max_pct_peak_loading
  mechanism: gaussian
  sensitivity: 0.1
  min_value: 0.0
  max_value: 150.0
  note: Use Gaussian Noise
- target: transformers.std_pct_peak_loading
  mechanism: gaussian
  sensitivity: 1.0
  sensitivity_kind: range_over_sqrt_n
  min_value: 0.0
  max_value: 150.0
  note: Use Gaussian Noise
- target: feeder_sections.kv
