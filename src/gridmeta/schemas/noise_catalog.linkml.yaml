id: https://w3id.org/grid-kitchen/gridmeta/noise-catalog
name: noise_catalog
title: Grid Kitchen Noise Catalog
description: >-
  Which properties of a dehydrated feeder model receive differential-privacy noise, by which
  mechanism and with which sensitivity. The privacy mode (low, moderate, high) supplies epsilon and
  delta; a rule supplies the mechanism and sensitivity. See PNNL-37723, "Differential Privacy in
  Grid Kitchen", sections 2.2 and 2.3.
license: BSD-3-Clause
version: 1.0.0
prefixes:
  linkml: https://w3id.org/linkml/
  gridmeta: https://w3id.org/grid-kitchen/gridmeta/
default_prefix: gridmeta
default_range: string
imports:
  - linkml:types

classes:
  NoiseCatalog:
    tree_root: true
    description: The privacy modes and one noise rule per catalogued property.
    attributes:
      modes:
        range: PrivacyMode
        multivalued: true
        inlined_as_list: true
        required: true
      rules:
        range: NoiseRule
        multivalued: true
        inlined_as_list: true
        required: true

  PrivacyMode:
    description: A named privacy level; smaller epsilon and delta give stronger privacy and more noise.
    attributes:
      name:
        identifier: true
      epsilon:
        range: float
        required: true
        minimum_value: 0
        description: Privacy budget.
      delta:
        range: float
        required: true
        minimum_value: 0
        description: Probability of failing the epsilon guarantee (Gaussian mechanism only).

  NoiseRule:
    description: How one property is perturbed.
    attributes:
      target:
        identifier: true
        pattern: "^[a-z_]+\\.[a-z_]+$"
        description: "<component>.<property>, e.g. transformers.kva."
      mechanism:
        range: Mechanism
        required: true
      sensitivity:
        range: float
        minimum_value: 0
        description: >-
          In the property's own units when sensitivity_kind is absolute; otherwise a multiplier on
          the range term (1 for the catalog's plain (max - min) / n).
      sensitivity_kind:
        range: SensitivityKind
        ifabsent: SensitivityKind(absolute)
      min_value:
        range: float
        description: Smallest plausible value; noisy values are clipped to it.
      max_value:
        range: float
        description: Largest plausible value; noisy values are clipped to it. Absent means unbounded.
      modes:
        range: PrivacyMode
        multivalued: true
        description: The modes that apply this rule; absent means every mode.
      note:
        description: Why this mechanism and sensitivity were chosen.
    rules:
      - description: Noise-adding mechanisms need a sensitivity.
        preconditions:
          slot_conditions:
            mechanism:
              any_of:
                - equals_string: gaussian
                - equals_string: discrete_laplace
        postconditions:
          slot_conditions:
            sensitivity:
              required: true

enums:
  Mechanism:
    permissible_values:
      gaussian:
        description: >-
          Continuous values: sigma = sensitivity * sqrt(2 ln(1.25 / delta)) / epsilon.
      discrete_laplace:
        description: Integer values; geometric noise with p = exp(-epsilon / sensitivity).
      randomized_response:
        description: Booleans; the reported value is flipped with a probability set by epsilon.
      none:
        description: Published unchanged (categorical or low-variability properties).

  SensitivityKind:
    permissible_values:
      absolute:
        description: The rule's sensitivity, in the property's own units.
      range_over_n:
        description: >-
          sensitivity * (global max - global min) / n, over the whole dataset; n is the number of
          items in it.
      range_over_sqrt_n:
        description: sensitivity * (global max - global min) / sqrt(n), over the whole dataset.
